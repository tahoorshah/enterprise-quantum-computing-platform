# Secret: PostgreSQL credentials
# Replaces plaintext POSTGRES_PASSWORD previously hardcoded in 01-postgres.yaml.
# Create/update in cluster with:
#   kubectl create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=qft_admin \
#     --from-literal=POSTGRES_PASSWORD=<real-password> \
#     --from-literal=POSTGRES_DB=qft_quantum_db \
#     --dry-run=client -o yaml | kubectl apply -f -
# This file documents the shape only; do not commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: qft_admin
  POSTGRES_PASSWORD: changeme_local_dev_only
  POSTGRES_DB: qft_quantum_db
  DATABASE_URL: postgresql://qft_admin:changeme_local_dev_only@postgres:5432/qft_quantum_db
